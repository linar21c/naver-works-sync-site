
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개인정보처리방침</title>
</head>
<body>
  <h1>개인정보처리방침</h1>

  <p>
    NAVER_WORKS_SYNC는 개인 일정 동기화
    목적으로 운영되는 애플리케이션입니다.
  </p>

  <h2>처리하는 정보</h2>
  <p>
    Google Calendar OAuth 인증 정보 및
    일정 동기화에 필요한 데이터를 처리합니다.
  </p>

  <h2>정보 이용 목적</h2>
  <p>
    NAVER WORKS 캘린더 일정을
    Google Calendar에 동기화합니다.
  </p>

  <h2>정보 보관</h2>
  <p>
    인증 정보 및 동기화 상태는 개인이 관리하는
    서버에 저장됩니다.
  </p>

  <h2>정보 삭제</h2>
  <p>
    사용자는 저장된 인증 정보와 동기화 상태를
    삭제하고 Google 계정에서 앱 접근 권한을
    철회할 수 있습니다.
  </p>
</body>
</html>
